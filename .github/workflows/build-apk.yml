name: Build Android APK

on:
  push:
    branches: [main, 'ccr-*']   # 'ccr-*' builds branches created by the Claude Code session; delete it if you do not want that
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # tests use Node's built-in SQLite (node:sqlite)
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # All optional. Without them the APK runs in Guest Mode. Add them under Settings > Secrets and variables > Actions.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners already ship the Android SDK ($ANDROID_HOME). We only add the exact components we need.
      - name: Install Android SDK components
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      # Maven Central sometimes answers GitHub's shared runner IPs with HTTP 429. Gradle keeps what it already
      # downloaded, so retrying with a pause normally succeeds on the next attempt.
      - name: Build debug and release APKs
        working-directory: android
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace \
                 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64; then
              exit 0
            fi
            echo "::warning::Gradle attempt $attempt failed. Retrying in $((attempt * 45))s"
            sleep $((attempt * 45))
          done
          exit 1

      - name: Show APK sizes
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Expo's template signs the release build with the debug keystore, so this APK installs on any phone.
      # For the Play Store, create your own keystore and signing config.
      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
